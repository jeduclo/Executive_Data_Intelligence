name: Refresh reporting data

on:
  schedule:
    - cron: "7 * * * *"   # hourly (GitHub's minimum is 5 min, but busy periods delay short schedules)
  workflow_dispatch: {}    # "Run workflow" button for live demos

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      # Each run rebuilds bronze/silver/gold from scratch (about a minute) and republishes to Postgres.
      - run: python pipeline/run.py
        env:
          PUBLISH_DATABASE_URL: ${{ secrets.PUBLISH_DATABASE_URL }}
          PORTAL_APP_PASSWORD: ${{ secrets.PORTAL_APP_PASSWORD }}
          POWERBI_PASSWORD: ${{ secrets.POWERBI_PASSWORD }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
